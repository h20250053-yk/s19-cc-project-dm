# Situation Analytics API: consumes the Flink results topic (incident-aggregates) -> Firestore analytics_windows,
# and serves /api/analytics/* (windows, summary, consistency, alerts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: situation-analytics
spec:
  replicas: 1
  selector:
    matchLabels: {app: situation-analytics}
  template:
    metadata:
      labels: {app: situation-analytics}
    spec:
      securityContext: {runAsUser: 10001}
      containers:
        - name: app
          image: s19/situation-analytics
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: s19-config}
          env:
            - {name: SERVICE_NAME, value: "situation-analytics"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: situation-analytics
  labels: {app: situation-analytics}
spec:
  selector: {app: situation-analytics}
  ports:
    - {name: http, port: 8080, targetPort: http}
