# Everything Argo CD deploys into namespace s19.
# Image addresses: cloud-computing-project-515018 is filled in by scripts/setup-repo.sh,
# newTag is updated by scripts/release.sh every time you build new images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: s19
resources:
  - incident-store.yaml
  - quorum-coordinator.yaml
  - incident-intake.yaml
  - resource-registry.yaml
  - volunteer-coordination.yaml
  - hpa.yaml
images:
  - name: s19/incident-store
    newName: us-central1-docker.pkg.dev/cloud-computing-project-515018/s19/incident-store
    newTag: v1117-213931
  - name: s19/quorum-coordinator
    newName: us-central1-docker.pkg.dev/cloud-computing-project-515018/s19/quorum-coordinator
    newTag: v1117-213931
  - name: s19/incident-intake
    newName: us-central1-docker.pkg.dev/cloud-computing-project-515018/s19/incident-intake
    newTag: v1117-213931
  - name: s19/resource-registry
    newName: us-central1-docker.pkg.dev/cloud-computing-project-515018/s19/resource-registry
    newTag: v1118-133226
  - name: s19/volunteer-coordination
    newName: us-central1-docker.pkg.dev/cloud-computing-project-515018/s19/volunteer-coordination
    newTag: v1118-133226
