# Volunteer Coordination: volunteers + assignments in Firestore (pods use the node's service account).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-coordination
spec:
  replicas: 1
  selector:
    matchLabels: {app: volunteer-coordination}
  template:
    metadata:
      labels: {app: volunteer-coordination}
    spec:
      securityContext: {runAsUser: 10001}
      containers:
        - name: app
          image: s19/volunteer-coordination
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: s19-config}
          env:
            - {name: SERVICE_NAME, value: "volunteer-coordination"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-coordination
  labels: {app: volunteer-coordination}
spec:
  selector: {app: volunteer-coordination}
  ports:
    - {name: http, port: 8080, targetPort: http}
