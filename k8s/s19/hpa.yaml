# Horizontal Pod Autoscalers for the two critical services (requirement c; load-tested in Phase 4)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-intake
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: incident-intake}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quorum-coordinator
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: quorum-coordinator}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
