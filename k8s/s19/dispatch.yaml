# Dispatch: REST API + Kafka consumer (incident-events -> auto-dispatch CRITICAL) + Kafka producer (dispatch-events)
# + Pub/Sub publisher (alert-requests). Calls Coordinator, Registry and Volunteer over REST. Cloud SQL table dispatch_assignments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
spec:
  replicas: 1
  selector:
    matchLabels: {app: dispatch}
  template:
    metadata:
      labels: {app: dispatch}
    spec:
      securityContext: {runAsUser: 10001}
      containers:
        - name: app
          image: s19/dispatch
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: s19-config}
          env:
            - {name: SERVICE_NAME, value: "dispatch"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: s19-secrets, key: DB_PASSWORD}}
            - {name: DB_POOL_MAX, value: "3"}
            - {name: AUTO_DISPATCH, value: "true"}
            - {name: AUTO_DISPATCH_SEVERITIES, value: "CRITICAL"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  labels: {app: dispatch}
spec:
  selector: {app: dispatch}
  ports:
    - {name: http, port: 8080, targetPort: http}
